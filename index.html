<style>

.timeline{position:relative;max-width:850px;padding-left:32px}.timeline:before{content:"";position:absolute;left:7px;top:5px;bottom:5px;width:1px;background:var(--line)}.release{position:relative;margin-bottom:36px}.release-dot{position:absolute;left:-30px;top:4px;width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 14%,transparent)}.release-head{display:flex;align-items:baseline;gap:9px}.release-head strong{font-size:15px}.release-head span{font-size:11px;color:var(--muted)}.release>p{font-size:12px;line-height:1.6;margin:7px 0 14px}.log-item{display:flex;align-items:flex-start;gap:10px;margin:9px 0;font-size:11px;line-height:1.55}.log-item b{width:20px;height:20px;flex:0 0 20px;display:grid;place-items:center;border-radius:50%;background:var(--surface2);font-size:13px}.log-add{color:var(--good)}.log-edit{color:var(--warn)}.log-mod{color:#fff}.log-stop{color:var(--danger)}
.admin-top{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:20px}.admin-top h1{font-size:clamp(34px,5vw,54px);letter-spacing:-.06em;margin:4px 0}.admin-top p{color:var(--muted);font-size:12px;margin:0}.role-pill{display:flex;align-items:center;gap:7px;padding:8px 11px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-size:11px;font-weight:800}.admin-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}.admin-stats>div{padding:14px 15px;border:1px solid var(--line);border-radius:18px;background:var(--surface);box-shadow:0 10px 30px rgba(0,0,0,.1)}.admin-stats span{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:10px}.admin-stats b{display:block;margin-top:6px;font-size:22px}.admin-toolbar{display:grid;grid-template-columns:1fr 160px auto;gap:8px;margin-bottom:10px}.wide-search{width:100%}.user-table{border:1px solid var(--line);border-radius:20px;overflow:hidden;background:var(--surface);box-shadow:0 15px 45px rgba(0,0,0,.12)}.user-head,.user-line{display:grid;grid-template-columns:minmax(240px,1.8fr) 110px 110px 150px 52px;align-items:center;gap:12px;padding:11px 14px}.user-head{font-size:9px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);background:var(--surface2);border-bottom:1px solid var(--line)}.user-line{border-bottom:1px solid var(--line);font-size:11px;transition:.18s}.user-line:last-child{border-bottom:0}.user-line:hover{background:var(--surface2)}.person{display:flex;align-items:center;gap:10px;min-width:0}.person b,.person small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.person b{font-size:12px}.person small{font-size:9px;color:var(--muted);margin-top:2px}.avatar{width:36px;height:36px;flex:0 0 36px;overflow:hidden;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 30%,transparent),var(--surface2));font-weight:850}.avatar img{width:100%;height:100%;object-fit:cover}.role-label{color:var(--muted)}.status-label{width:max-content;padding:5px 8px;border-radius:999px;background:var(--surface2);font-size:9px}.status-label.good{color:var(--good)}.status-label.bad{color:var(--danger)}.admin-icon{display:inline-grid;place-items:center;font-size:14px;line-height:1}.icon-btn{width:32px;height:32px;border-radius:10px;background:var(--surface2);border:1px solid var(--line);color:var(--muted);transition:.2s}.icon-btn:hover{background:var(--text);color:var(--bg)}.modal{position:fixed;inset:0;z-index:500;display:grid;place-items:center;padding:20px;background:rgba(0,0,0,.58);backdrop-filter:blur(18px);animation:fade .2s}.modal-card{width:min(560px,100%);padding:24px;border:1px solid var(--line);border-radius:24px;background:var(--glass);backdrop-filter:blur(34px) saturate(170%);box-shadow:var(--shadow);position:relative;animation:modalIn .3s cubic-bezier(.16,1,.3,1)}.modal-close{position:absolute;right:13px;top:13px;width:32px;height:32px;border-radius:10px;background:var(--surface2)}.profile-large{display:flex;align-items:center;gap:12px;margin-bottom:18px}.profile-large .avatar{width:52px;height:52px;flex-basis:52px}.profile-large h2{margin:0;font-size:20px}.profile-large p{margin:4px 0 0;color:var(--muted);font-size:11px}.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.detail-grid div{padding:11px;border-radius:13px;background:var(--surface2)}.detail-grid span{display:block;color:var(--muted);font-size:9px;text-transform:uppercase;letter-spacing:.1em}.detail-grid b{display:block;margin-top:4px;font-size:11px;overflow:hidden;text-overflow:ellipsis}.modal-note{margin:14px 0;color:var(--muted);font-size:10px;line-height:1.55}.moderation-actions{display:flex;gap:7px;flex-wrap:wrap}.restriction{position:fixed;inset:0;z-index:900;display:grid;place-items:center;padding:20px;background:rgba(5,6,9,.92);backdrop-filter:blur(30px)}.restriction-card{width:min(520px,100%);padding:30px;border:1px soli @media(max-width:850px){.hero{grid-template-columns:1fr;min-height:auto}.hero-orb{width:180px;justify-self:start}.settings-grid{grid-template-columns:1fr}.admin-stats{grid-template-columns:repeat(2,1fr)}.user-head{display:none}.user-line{grid-template-columns:1fr auto auto}.user-line>.role-label,.user-line>.muted{display:none}.admin-toolbar{grid-template-columns:1fr}.page{padding:18px}.nav button{padding:9px 10px}.brand span{display:none}}

<body><div class="backdrop"></div>
<header class="chrome"><div class="nav-trigger" tabindex="0" aria-label="Show navigation"></div><div class="nav-wrap"><nav class="nav"><div class="brand"><img src="offline/logo.png" alt="Flash"><span>Flash</span></div><button class="active" data-view="home"><span class="glyph">⌂</span>Home</button><button data-view="store"><span class="glyph">▦</span>Store</button><button data-view="library"><span class="glyph">◫</span>Library</button><button data-view="updates"><span class="glyph">◌</span>Updates</button><button data-view="settings"><span class="glyph">⚙</span>Settings</button><button id="adminNav" class="hidden" data-view="admin"><span class="glyph">♢</span>Admin</button></nav></div></header>
