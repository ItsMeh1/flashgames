<!doctype html><html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07080c"><meta name="description" content="Flash Games"><title>Flash Games</title><link rel="icon" href="./offline/logo.png"><script src="https://unpkg.com/lucide@latest"></script><script src="https://www.gstatic.com/firebasejs/11.0.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/11.0.1/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore-compat.js"></script><link rel="stylesheet" href="./styles.css"><script>if('serviceWorker'in navigator){navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'}).then(r=>r.update()).catch(()=>{})}</script></head><body><div class="ambient" aria-hidden="true"><i></i><i></i><i></i></div><header class="topbar glass"><a class="brand" href="#home" data-route="home"><span class="brand-mark"><img src="./offline/logo.png" alt=""></span><span>Flash <b>Games</b></span></a><nav class="desktop-nav"><button class="nav-item active" data-route="home"><i data-lucide="house"></i><span>Home</span></button><button class="nav-item" data-route="library"><i data-lucide="library"></i><span>Library</span></button><button class="nav-item" data-route="store"><i data-lucide="store"></i><span>Store</span></button><button class="nav-item" data-route="social"><i data-lucide="users"></i><span>Social</span></button><button class="nav-item" data-route="updates"><i data-lucide="history"></i><span>Updates</span></button><button class="nav-item hidden" id="adminNav" data-route="admin"><i data-lucide="shield-check"></i><span>Admin</span></button><span class="nav-indicator"></span></nav><div class="top-actions"><button class="icon-btn" id="openSearch"><i data-lucide="search"></i><kbd>⌘K</kbd></button><button class="icon-btn notification" id="openNotifications"><i data-lucide="bell"></i><b id="notificationBadge" hidden></b></button><button class="profile-chip" id="openProfile"><span class="avatar" id="headerAvatar"><span></span><img src="./offline/logo.png" alt=""></span><strong id="headerName">Sign in</strong><i data-lucide="chevron-down"></i></button></div></header><main id="app"><section class="view active" id="homeView" data-view="home"></section><section class="view" id="libraryView" data-view="library"></section><section class="view" id="storeView" data-view="store"></section><section class="view" id="socialView" data-view="social"></section><section class="view" id="updatesView" data-view="updates"></section><section class="view" id="adminView" data-view="admin"></section></main><nav class="bottom-dock glass"><button class="dock-item active" data-route="home"><i data-lucide="house"></i><span>Home</span></button><button class="dock-item" data-route="library"><i data-lucide="library"></i><span>Library</span></button><button class="dock-item" data-route="store"><i data-lucide="store"></i><span>Store</span></button><button class="dock-item" data-route="social"><i data-lucide="users"></i><span>Social</span></button><button class="dock-item" id="mobileProfile"><i data-lucide="user-round"></i><span>Profile</span></button></nav><div class="modal-backdrop" id="searchBackdrop" hidden><section class="search-modal glass"><div class="search-head"><div><span class="eyebrow">QUICK FIND</span><h2>Search games</h2></div><button class="icon-btn" data-close="searchBackdrop"><i data-lucide="x"></i></button></div><label class="command-search"><i data-lucide="search"></i><input id="searchInput" autocomplete="off" placeholder="Search games, genres, tags…"><kbd>ESC</kbd></label><div id="searchResults" class="search-results"></div></section></div><aside class="side-panel glass" id="profilePanel" hidden><div class="panel-head"><div><span class="eyebrow">ACCOUNT</span><h2>Profile</h2></div><button class="icon-btn" data-close="profilePanel"><i data-lucide="x"></i></button></div><div class="profile-hero"><span class="avatar large" id="profileAvatar"><span></span><img src="./offline/logo.png" alt=""></span><h3 id="profileName">Sign in</h3><p id="profileEmail"></p></div><div class="profile-stats"><div><strong id="profileGames">0</strong><span>Library</span></div><div><strong id="profileTotal">0</strong><span>Available</span></div></div><div class="auth-box"><div class="auth-row"><input id="authEmail" type="email" placeholder="Email"><input id="authPassword" type="password" placeholder="Password"></div><div class="auth-actions"><button class="btn primary" id="signInBtn"><i data-lucide="log-in"></i> Sign in</button><button class="btn" id="signOutBtn" hidden><i data-lucide="log-out"></i> Sign out</button></div><p class="panel-note" id="authStatus"></p></div><button class="setting-action" id="openSettings"><span><i data-lucide="sliders-horizontal"></i><span><strong>Preferences</strong><small>Theme, glass and motion.</small></span></span><i data-lucide="chevron-right"></i></button></aside><aside class="side-panel glass" id="settingsPanel" hidden><div class="panel-head"><div><span class="eyebrow">PERSONALIZE</span><h2>Settings</h2></div><button class="icon-btn" data-close="settingsPanel"><i data-lucide="x"></i></button></div><div class="settings-list"><div class="setting"><div><strong>Theme</strong><small>Choose the glass mode.</small></div><div class="segmented" id="themeChoices"><button data-theme="dark">Dark</button><button data-theme="light">Light</button><button data-theme="system">Auto</button></div></div><div class="setting"><div><strong>Accent</strong><small>Interface glow color.</small></div><input class="color-picker" id="accentPicker" type="color" value="#8b5cf6"></div><input class="range" id="opacityRange" type="range" min="35" max="85" value="66"><input class="range" id="blurRange" type="range" min="8" max="36" value="20"><button class="setting-action" id="toggleMotion"><span><i data-lucide="sparkles"></i><span><strong>Motion</strong><small>Keep animations enabled.</small></span></span><span class="switch on"><i></i></span></button><button class="setting-action" id="clearLibrary"><span><i data-lucide="trash-2"></i><span><strong>Clear library</strong><small>Remove local installs.</small></span></span><i data-lucide="chevron-right"></i></button></div></aside><div class="modal-backdrop" id="notificationsBackdrop" hidden><section class="notification-modal glass"><div class="panel-head"><div><span class="eyebrow">ACTIVITY</span><h2>Notifications</h2></div><button class="icon-btn" data-close="notificationsBackdrop"><i data-lucide="x"></i></button></div><div id="notificationList" class="notification-list"></div></section></div><div class="modal-backdrop" id="dialogBackdrop" hidden><section class="confirm-dialog glass"><div class="dialog-icon" id="dialogIcon"></div><span class="eyebrow">CONFIRM</span><h2 id="dialogTitle">Are you sure?</h2><p id="dialogText"></p><div class="dialog-actions"><button class="btn" id="dialogCancel">Cancel</button><button class="btn primary" id="dialogConfirm">Continue</button></div></section></div><div class="toast-stack" id="toastStack"></div><div class="player-overlay" id="playerOverlay" hidden><div class="player-shell glass"><button class="icon-btn player-close" id="closePlayer"><i data-lucide="x"></i></button><iframe id="gameFrame" title="Game" allow="fullscreen; autoplay; gamepad"></iframe></div></div><script src="./data.js"></script><script src="./app.js"></script><script src="./qol.js"></script></body></html>
