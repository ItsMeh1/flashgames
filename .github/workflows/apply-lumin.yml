name: Apply LuminSDK integration

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Inject LuminSDK arcade
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          marker_start = '<!-- FLASH-LUMIN-START -->'
          if marker_start in text:
              print('LuminSDK integration already present; nothing to do.')
              raise SystemExit(0)

          block = r'''<!-- FLASH-LUMIN-START -->
          <section id="lumin-arcade" class="w-full max-w-[1400px] mx-auto px-4 sm:px-6 lg:px-8 py-10 md:py-14">
              <div class="glass-panel-dark rounded-[2rem] border border-white/10 overflow-hidden shadow-2xl">
                  <div class="p-6 md:p-8 border-b border-white/10 bg-white/[0.02]">
                      <div class="flex flex-col md:flex-row md:items-end md:justify-between gap-4">
                          <div>
                              <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-indigo-500/15 border border-indigo-500/20 text-indigo-200 text-[11px] font-bold uppercase tracking-[0.2em]">
                                  LuminSDK Arcade
                              </div>
                              <h2 class="mt-3 text-2xl md:text-3xl font-bold text-white tracking-tight">Even more games.</h2>
                              <p class="mt-2 text-sm md:text-base text-slate-400 max-w-2xl">Your normal Flash Games library stays right where it is. Lumin adds its browser-game catalog alongside it, with built-in search, categories, random play, and fullscreen gameplay.</p>
                          </div>
                          <a href="https://docs.luminsdk.com/" target="_blank" rel="noopener noreferrer" class="shrink-0 inline-flex items-center justify-center px-4 py-2.5 rounded-2xl btn-glass text-sm font-semibold text-slate-200 border border-white/10 hover:text-white">LuminSDK docs ↗</a>
                      </div>
                  </div>
                  <div id="lumin-games" class="min-h-[520px] w-full bg-slate-950/40"></div>
              </div>
          </section>
          <script src="https://cdn.jsdelivr.net/gh/luminsdk/script@latest/lumin.min.js"></script>
          <script>
              (() => {
                  const initLumin = async () => {
                      const container = document.getElementById('lumin-games');
                      if (!container || !window.Lumin) return;

                      try {
                          await Lumin.init({
                              container,
                              theme: 'dark',
                              columns: 6,
                              rows: 4,
                              gamesPerPage: 24,
                              showSearch: true,
                              showCategories: true,
                              showRandom: true,
                              onError: (error) => {
                                  console.error('LuminSDK error:', error);
                              }
                          });
                      } catch (error) {
                          console.error('Failed to initialize LuminSDK:', error);
                          container.innerHTML = `
                              <div class="min-h-[420px] flex items-center justify-center p-8 text-center">
                                  <div>
                                      <div class="text-3xl mb-3">⚠️</div>
                                      <h3 class="text-white font-bold text-lg">Lumin Arcade couldn't load</h3>
                                      <p class="text-slate-400 text-sm mt-2 max-w-md">Your local Flash Games library is still available above. Check your connection and reload to try Lumin again.</p>
                                  </div>
                              </div>
                          `;
                      }
                  };

                  if (document.readyState === 'loading') {
                      document.addEventListener('DOMContentLoaded', initLumin, { once: true });
                  } else {
                      initLumin();
                  }
              })();
          </script>
          <!-- FLASH-LUMIN-END -->
          '''

          # Keep the injection at the very end of the document so it does not disturb
          # the existing Offline Games Pack/game portal markup.
          needle = '</body>'
          if needle not in text:
              raise SystemExit('index.html does not contain </body>')

          text = text.replace(needle, block + '\n' + needle, 1)
          path.write_text(text, encoding='utf-8')
          print('Injected LuminSDK arcade into index.html')
          PY

      - name: Commit LuminSDK integration
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "feat: add LuminSDK arcade"
          git push
